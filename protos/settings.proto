syntax = "proto3";

package app.v1;

enum Environment {
    ENVIRONMENT_UNSPECIFIED = 0;
    ENVIRONMENT_DEV = 1;
    ENVIRONMENT_PROD = 2;
}
message Settings {
    Environment env = 1;

    ApiServiceSettings api_service_settings = 2;
    StorageServiceSettings storage_service_settings = 3;
}

message ApiServiceSettings {
    int32 port = 1;
    JwtSettings jwt_settings = 2;
}

message JwtSettings {
    string secret = 1;
    string algorithm = 2;
    int32 access_token_expiration_seconds = 3;
    int32 refresh_token_expiration_seconds = 4;
}

message StorageServiceSettings {
    int32 port = 1;
}