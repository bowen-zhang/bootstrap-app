events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        server_name [DOMAIN];
        location /api/ {
            proxy_pass http://localhost:50051/;
            proxy_http_version 1.1;             # required for streaming
            proxy_buffering off;                # recommended for streaming
            proxy_request_buffering off;        # recommended for streaming 
            proxy_pass_trailers on;             # required for gRPC
        }

        location / {
            root [PROJECT_DIR]/runtime/web;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
