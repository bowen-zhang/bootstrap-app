events {}

http {
    access_log logs/access.log;
    access_log /dev/stdout;

    include       mime.types;
    default_type  application/octet-stream;
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080 ssl;
        server_name localhost;

        ssl_certificate localhost+2.pem;
        ssl_certificate_key localhost+2-key.pem;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;

        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        location /api/ {
            proxy_pass http://localhost:50051/;
            proxy_http_version 1.1;             # required for streaming
            proxy_buffering off;                # recommended for streaming
            proxy_request_buffering off;        # recommended for streaming 
            proxy_pass_trailers on;             # required for gRPC
        }

        location / {
            root ../web/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
